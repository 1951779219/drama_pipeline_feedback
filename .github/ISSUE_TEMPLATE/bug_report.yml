name: Bug report
description: 报告软件错误或异常行为
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 在窗口标题或软件更新页查看
      placeholder: "3.9.14fix2"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 出问题的模块
      options:
        - 启动/授权
        - 下载
        - 合成
        - 人声分离
        - 混音导出
        - 上传
        - 联机模式
        - 自动监测
        - 软件更新
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按 1、2、3 写清楚怎么触发
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / 日志 / 截图
      description: 可以粘贴运行日志里的关键错误
    validations:
      required: true
